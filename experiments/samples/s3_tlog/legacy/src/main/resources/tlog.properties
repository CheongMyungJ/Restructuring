#############################################################
# TLOG 배치 설정
#  - DB 접속정보는 환경변수로 주입 (TLOG_DB_URL / TLOG_DB_USER / TLOG_DB_PASSWORD)
#############################################################
jdbc.driverClassName=org.h2.Driver
#jdbc.driverClassName=oracle.jdbc.driver.OracleDriver
jdbc.url=${TLOG_DB_URL}
jdbc.username=${TLOG_DB_USER:sa}
jdbc.password=${TLOG_DB_PASSWORD:}
jdbc.initialSize=2
jdbc.maxTotal=10

# 디렉토리 (TLOG_HOME 기준)
dir.home=${TLOG_HOME}
dir.outbox=${TLOG_HOME}/outbox

# chunk 크기
load.commit.interval=100
judge.commit.interval=50
judge.page.size=100
